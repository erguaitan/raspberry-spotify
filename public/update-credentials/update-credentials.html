<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="update-credentials.css">
  <title>Update Credentials</title>
</head>
<body>
  <h1>Update Credentials</h1>
  <form>
    <div class="form-box">
      <label for="client_id">CLIENT_ID</label>
      <input type="text" name="client_id" id="client_id">
    </div>
    
    <div class="form-box">
      <label for="client_secret">CLIENT_SECRET</label>
      <input type="text" name="client_secret" id="client_secret">
    </div>

    <div class="form-box">
      <label for="redirect_uri">REDIRECT_URI</label>
      <input type="text" name="redirect_uri" id="redirect_uri">
    </div>

    <button type="submit">Enviar</button>
  </form>
  
  <script src="update-credentials.js"></script>
</body>
</html>
